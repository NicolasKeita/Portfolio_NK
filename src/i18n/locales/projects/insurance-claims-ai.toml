[description]
fr = """Plateforme d’aide aux gestionnaires de sinistres automobiles : elle extrait les informations des déclarations, contrats, devis et photos, puis prépare un dossier structuré pour le triage et l’investigation.

Le système combine analyse de documents et d’images, modèles de sévérité et de risque, recherche des clauses contractuelles par RAG et agent d’investigation. Il signale les informations manquantes et les incohérences, propose un parcours de traitement et justifie ses recommandations avec leurs sources.

La démo interactive présente des cas synthétiques et des résultats préparés. Les décisions juridiques et financières restent soumises à une validation humaine."""
en = """A platform that assists motor insurance claims handlers: it extracts information from claim forms, policies, repair estimates, and photos, then prepares a structured case for triage and investigation.

The system combines document and image analysis, severity and risk models, RAG over policy clauses, and an investigation agent. It flags missing information and inconsistencies, suggests a handling workflow, and supports its recommendations with sources.

The interactive demo presents synthetic cases and prepared results. Legal and financial decisions remain subject to human review."""

