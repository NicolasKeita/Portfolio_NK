[description]
fr = """Projet en cours de développement : une plateforme d'aide aux gestionnaires de sinistres automobiles. Elle vise à extraire les informations des déclarations, contrats, devis et photos, puis à préparer un dossier structuré pour le triage et l'investigation.

Le système envisagé combine analyse de documents et d'images, modèles de sévérité et de risque, recherche des clauses contractuelles par RAG et agent d'investigation. Il doit signaler les informations manquantes et les incohérences, proposer un parcours de traitement et justifier ses recommandations avec leurs sources.

Les décisions juridiques et financières restent soumises à une validation humaine. Les composantes ML, agentiques et MLOps décrites ici constituent la portée du projet en cours, pas des résultats déjà déployés."""
en = """Project in progress: a platform to assist motor insurance claims handlers. It aims to extract information from claim forms, policies, repair estimates, and photos, then prepare a structured case for triage and investigation.

The planned system combines document and image analysis, severity and risk models, RAG over policy clauses, and an investigation agent. It is intended to flag missing information and inconsistencies, suggest a handling workflow, and support recommendations with sources.

Legal and financial decisions remain subject to human review. The ML, agent, and MLOps components described here are the scope of ongoing work, not deployed results."""

