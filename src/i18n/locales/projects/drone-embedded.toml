[description]
fr = """Banc de développement et de validation d'un système de contrôle de vol distribué pour un aéronef simulé. Le contrôleur FC1 pilote la mission et les commandes, tandis que FC2 supervise l'état du système et participe à la gestion des fautes.

Le même cœur logiciel est exercé en simulation à pas fixe (SIL), en boucle HIL locale et sur deux cartes Nucleo-L476RG avec firmwares Zephyr. Le PC conserve le modèle de l'aéronef, des capteurs et des actionneurs. Des scénarios de fautes, une campagne Monte Carlo et une matrice de traçabilité structurent la validation. Un visualiseur Digital Twin en React et Three.js affiche la télémétrie en direct ou en relecture.

Le projet est un banc d'ingénierie : les performances du HIL physique et l'aptitude au vol réel ne sont pas établies par une campagne de mesures publiée."""
en = """Development and validation testbed for a distributed flight-control system operating on a simulated aircraft. FC1 handles the mission and control commands, while FC2 monitors system health and contributes to fault handling.

The same software core runs in fixed-step software simulation (SIL), local HIL loopback, and on two Nucleo-L476RG boards running Zephyr firmware. The PC retains the aircraft, sensor, and actuator models. Fault scenarios, a Monte Carlo campaign, and a traceability matrix structure validation. A React and Three.js Digital Twin viewer displays live or replayed telemetry.

This is an engineering testbed: physical HIL performance and readiness for real flight have not been established by a published measurement campaign."""

